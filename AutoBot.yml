# AutoBot.yml —— 上游吸收的声明式配置。
#
# 本文件只是契约：谁来读它见 .github/workflows/autobot.yml（schedule + workflow_dispatch）。
# 改行为只改这里，不用改代码。

version: 1

upstream:
  repo: linguo2625469/workbuddy2api-panel
  remote: upstream          # 只在 CI 里临时添加，不写进本地 remote
  # 顺带扫的兄弟项目。它们不是本仓 fork，多是 Python 实现：代码不能搬，但**行为**可以借鉴。
  # mode=port 让 LLM 读懂上游逻辑，用 Go 在本仓重写并接进既有调用路径；只新增文件不接线的
  # （孤儿实现）会被丢弃，落地前还要过 go build / go vet / go test。
  repos_mode: port
  # 一轮把全部仓库的候选都收上来做分诊——按天轮转会让活跃仓的更新等一周才被看到。
  # 分诊按仓分批喂模型（一个仓一次调用 / 全塞一个 prompt 会顶爆上下文，都不可取）。
  triage_batch: 6
  triage_top: 6         # 分诊时每批最多挑几条
  land_max: 2           # 每轮最多真正落地几条（每条会起 agent，5-10 分钟）
  repos:
    - ardeyouxipianyi/workbuddy2api-hub
    - yuechuya/WorkBuddy2API-Gateway
    - HUIdada1/AgentHub
    - 3155498108/workbuddy-one
    - sheng-du0521/workbuddy2api
    - OHCJ099/BuddyHub
    - hj01857655/WorkBuddy2api
    - Agent2API/agent2api
    - syan-anan/wb-syan
    - JackAIStudio/dsh-workbuddy-dual
    - smart-open/TraeWorkAssistant
    - deltrivx/AutoBuddy
    - techysy/CreditDaddy
    - spdw666/multi-agent-checkin-dsh
    - 1557335006/workbuddy-checkin-tool
    - Yhx888/dsh-free-egg-credits
    - Costben/workbuddy2api
    - zr987459/workbuddy-app
    - chenpiyanghappy/dsh-buddy-suite
    - bhh3349/workbuddy2api-prime
    - dhdbvcg/dsh-workbuddy-console
    - chengzhi-c/pi-desktop-wtq-pool
    - chengzhi-c/dsh-wtq-pool
    - liberation8/hermes-workbuddy-provider
    - Misaka10091/workbuddy2api-panel
    - xibai6668/Android-AI-gateway
    - pandarick916/workbuddy_checkin
    - 2861292267/DSH-Official-WorkBuddy-Credit-Proxy
    - ithtelab/workbuddy-manager
    - caigee-cmd/cli2api
    - 241793/workbuddy2API
    - majiabin2020/WorkMami
    - FireOpalus/dsh-workbuddy2api
    - NextAgentX/qoder-trae-workbuddy-switch
    - sofs2005/w2a
    - dingminhua/dsh-connect-workbuddy
    - newtypepan12-svg/workbuddy-qiandao
    - pkqzzt/workbuddy2api-panel-plus
    - rcwowhoo/workbuddy-checkin
    - lehuaner/SSHMonitor
    - Faide-cyber/dsh-workbuddy
    - wefewe/workbuddy2api
    - ChaYeWuu/dsh-hyperworkbuddy
    - wicm84266964/Buddy2api
    - xiaofan6ya/workbuddy2api
    - HXX-ita/workbuddy-checkin
    - thintsing/agent-checkin
    - stevenwang288/WorkBuddy-Daily
    - study-yang/workbuddy2codex
    - gray0128/pi-workbuddy-connect
    - autumnsentiment/workbuddy-helper
    - GeekFong/traework-checkin-assistant
    - jerry9692/dsh-workbuddy2api-panel
    - babygoton/WorkDaddy
    - AndroidSix/dsh-multi-router
