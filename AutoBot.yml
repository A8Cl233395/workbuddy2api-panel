# AutoBot.yml —— 上游吸收的声明式配置。
#
# 本文件只是契约：谁来读它见 .github/workflows/autobot.yml（schedule + workflow_dispatch）。
# 改行为只改这里，不用改代码。

version: 1

upstream:
  repo: linguo2625469/workbuddy2api-panel
  remote: upstream          # 只在 CI 里临时添加，不写进本地 remote
  # 顺带扫的兄弟项目。它们不是本仓 fork，语言/结构都不同，源码搬进来只会变成垃圾文件，
  # 所以统一走 mode=adapt：只让 LLM 产出「改本仓既有文件」的补丁，产不出就跳过、不开 PR。
  repos_mode: adapt
  repos:
    - ardeyouxipianyi/workbuddy2api-hub
    - ithtelab/workbuddy-manager
    - 88lin/workbuddy-auto-signin
  # 取最近 N 条未处理的提交（每个上游各取 N 条）。刻意按条数而不是按天数：「N 天前」在上游安静的周里
  # 会恒为空（实测上游最后一条非 merge 提交是 10-11，7 天窗口刚好把它排除），
  # 白跑一轮还看不出是配置还是故障。已处理过的靠分支名去重，不需要状态文件。
  limit: 30

policy:
  base: main
  branch_prefix: autobot/
  label: autobot
  max_prs_per_run: 1        # 一次最多开一个 PR：宁可少，不可轰炸
  # 允许改测试：不允许的话「有没有回归」就无法证明。
  allow_test_changes: true
  # LLM 的职责边界：只做「挑哪条」，不写代码。代码由 git cherry-pick 搬，
  # 由 go test 判定能不能留——让模型凭空生成 Go 补丁的成功率不够，且无法验证。
  mode: cherry-pick

  # 硬禁项。这是给执行者划的线，不是提示词里的软约束：
  never:
    - push_main
    - merge
    - tag
    - release
    - deploy
    - .github/workflows/**
    - AGENTS.md
    - config.example.json
