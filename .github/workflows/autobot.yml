name: autobot

# 每日挑一条上游改动 → 适配到本仓 → 跑测试 → 提 PR 给人审。
# 声明与禁项在仓库根的 AutoBot.yml；这里只做执行。
# 注意：用 AUTOBOT_TOKEN（PAT）而不是默认 GITHUB_TOKEN——后者触发的 push/PR
# 不会再触发其它 workflow，PR 上就不会有 binaries 的 test 与四平台构建。

on:
  schedule:
    - cron: "30 1 * * *" # UTC 01:30 = 上海 09:30
  workflow_dispatch:
    inputs:
      repo:
        description: "临时看别的仓库（owner/name），留空则用 AutoBot.yml 里的上游"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autobot
  cancel-in-progress: false

jobs:
  absorb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOBOT_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # PyYAML 在 ubuntu-latest 上不保证预装，装一次比写个手解析器便宜。
      - run: python3 -m pip install --quiet pyyaml

      - name: 挑选、适配与提 PR
        env:
          GH_TOKEN: ${{ secrets.AUTOBOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SRC: ${{ inputs.repo }}
        run: |
          if [ -n "$SRC" ]; then
            python3 scripts/autobot.py --repo "$SRC"
          else
            python3 scripts/autobot.py
          fi

      - name: 报告进 job summary
        if: always()
        run: cat autobot-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "无报告" >> "$GITHUB_STEP_SUMMARY"
