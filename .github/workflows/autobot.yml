name: autobot

# 三步：clone 每个参考仓库 → agent 读代码写差异报告 → 汇总选优后写 Go 实现并开 PR。
# 声明与禁项在仓库根的 AutoBot.yml；这里只做执行与分片。
# 注意：用 AUTOBOT_TOKEN（PAT）而不是默认 GITHUB_TOKEN——后者触发的 push/PR
# 不会再触发其它 workflow，PR 上就不会有 binaries 的 test 与四平台构建。

on:
  schedule:
    - cron: "30 1 * * *" # UTC 01:30 = 上海 09:30
  workflow_dispatch:
    inputs:
      repo:
        description: "只分析这一个仓库（owner/name），留空则按 AutoBot.yml 全量"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autobot
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
      repos: ${{ steps.shards.outputs.repos }}
    steps:
      - uses: actions/checkout@v4
      - name: 按 AutoBot.yml 生成分片
        id: shards
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, math, os, yaml
          cfg = yaml.safe_load(open("AutoBot.yml", encoding="utf-8"))["upstream"]
          repos = cfg["repos"]
          size = int(cfg.get("shard_size") or 4)
          n = math.ceil(len(repos) / size)
          print("repos=%d" % len(repos))
          print("matrix=" + json.dumps({"shard": [f"{i}/{n}" for i in range(n)]}))
          PY

  analyze:
    needs: plan
    # 66 个仓一个 job 串行跑不完，按片并行；每片自己 clone、自己分析、自己上传报告
    strategy:
      fail-fast: false
      # 免费档速率限制很紧：实测 17 片并发第一分钟就 429
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装 PI 并写入网关配置
        env:
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
        run: |
          npm i -g @earendil-works/pi-coding-agent
          python3 - <<'PY'
          import json, os
          d = os.environ["PI_CODING_AGENT_DIR"]
          os.makedirs(d, exist_ok=True)
          cfg = {"providers": {"ci": {
              "baseUrl": os.environ["LLM_BASE_URL"].rstrip("/"),
              "apiKey": os.environ["LLM_API_KEY"],
              "api": "openai-completions",
              "models": [{"id": os.environ["LLM_MODEL"], "name": "ci",
                          "contextWindow": int(os.environ.get("LLM_CONTEXT") or 524288),
                          "maxTokens": int(os.environ.get("LLM_MAX_TOKENS") or 32768)}]}}}
          open(os.path.join(d, "models.json"), "w").write(json.dumps(cfg))
          PY
          pi --list-models
      - run: python3 -m pip install --quiet pyyaml
      - name: 探活模型网关
        # 网关/模型名不通时会在 agent 里挂满 25 分钟才超时，这里先 90 秒问一次
        env:
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          code=$(curl -s -o /tmp/probe.json -w '%{http_code}' -m 90 -X POST "$LLM_BASE_URL/chat/completions" \
            -H "Authorization: Bearer $LLM_API_KEY" -H 'Content-Type: application/json' \
            -d "{\"model\":\"$LLM_MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_tokens\":4}")
          echo "HTTP $code"; head -c 400 /tmp/probe.json; echo
          [ "$code" = "200" ] || { echo "网关不可用：$LLM_BASE_URL / $LLM_MODEL"; exit 1; }

      - name: 分析这一片
        # 指定单仓时只有第 0 片干活，其余跳过（job 级 if 引用不了 matrix，只能放这里）
        if: inputs.repo == '' || startsWith(matrix.shard, '0/')
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
          PI_SKIP_VERSION_CHECK: "1"
          SRC: ${{ inputs.repo }}
        run: |
          if [ -n "$SRC" ]; then
            python3 scripts/autobot.py --phase analyze --repo "$SRC"
          else
            python3 scripts/autobot.py --phase analyze --shard "${{ matrix.shard }}"
          fi
      - name: 报告进 job summary
        if: always()
        run: cat autobot-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ strategy.job-index }}
          path: /tmp/autobot-reports
          if-no-files-found: ignore

  implement:
    needs: analyze
    if: always() && needs.analyze.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTOBOT_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装 PI 并写入网关配置
        env:
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
        run: |
          npm i -g @earendil-works/pi-coding-agent
          python3 - <<'PY'
          import json, os
          d = os.environ["PI_CODING_AGENT_DIR"]
          os.makedirs(d, exist_ok=True)
          cfg = {"providers": {"ci": {
              "baseUrl": os.environ["LLM_BASE_URL"].rstrip("/"),
              "apiKey": os.environ["LLM_API_KEY"],
              "api": "openai-completions",
              "models": [{"id": os.environ["LLM_MODEL"], "name": "ci",
                          "contextWindow": int(os.environ.get("LLM_CONTEXT") or 524288),
                          "maxTokens": int(os.environ.get("LLM_MAX_TOKENS") or 32768)}]}}}
          open(os.path.join(d, "models.json"), "w").write(json.dumps(cfg))
          PY
          pi --list-models
      - run: python3 -m pip install --quiet pyyaml
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
          pattern: reports-*
      - name: 汇总报告
        run: |
          mkdir -p /tmp/autobot-reports
          if [ -d /tmp/artifacts ]; then
            find /tmp/artifacts -name '*.md' -exec cp {} /tmp/autobot-reports/ \;
          fi
          echo "报告数: $(ls /tmp/autobot-reports | wc -l)"
      - name: 落地并开 PR
        env:
          GH_TOKEN: ${{ secrets.AUTOBOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
          PI_SKIP_VERSION_CHECK: "1"
        run: python3 scripts/autobot.py --phase implement
      - name: 报告进 job summary
        if: always()
        run: cat autobot-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
