name: autobot

# 每日挑一条上游改动 → 适配到本仓 → 跑测试 → 提 PR 给人审。
# 声明与禁项在仓库根的 AutoBot.yml；这里只做执行。
# 注意：用 AUTOBOT_TOKEN（PAT）而不是默认 GITHUB_TOKEN——后者触发的 push/PR
# 不会再触发其它 workflow，PR 上就不会有 binaries 的 test 与四平台构建。

on:
  schedule:
    - cron: "30 1 * * *" # UTC 01:30 = 上海 09:30
  workflow_dispatch:
    inputs:
      repo:
        description: "临时看别的仓库（owner/name），留空则用 AutoBot.yml 里的上游"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autobot
  cancel-in-progress: false

jobs:
  absorb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOBOT_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 落地环节用 PI 的 agent 循环（自己 grep/读/改/跑测试），不再一次性出补丁。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 PI 并写入网关配置
        env:
          # PI 需要原生 function calling；duck 只有文本协议模拟，模型肯不肯发调用全看运气
          PI_BASE_URL: ${{ vars.PI_BASE_URL }}
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          PI_MODEL: ${{ vars.PI_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
        run: |
          npm i -g @earendil-works/pi-coding-agent
          # 用 python 生成，免掉 heredoc 里 baseUrl 带引号的转义问题
          python3 - <<'PY'
          import json, os
          d = os.environ["PI_CODING_AGENT_DIR"]
          os.makedirs(d, exist_ok=True)
          base = os.environ.get("PI_BASE_URL") or os.environ["LLM_BASE_URL"]
          key = os.environ.get("PI_API_KEY") or os.environ["LLM_API_KEY"]
          model = os.environ.get("PI_MODEL") or os.environ["LLM_MODEL"]
          cfg = {"providers": {"ci": {
              "baseUrl": base.rstrip("/"),
              "apiKey": key,
              "api": "openai-completions",
              "models": [{"id": model, "name": "ci",
                          "contextWindow": 128000, "maxTokens": 8192}]}}}
          open(os.path.join(d, "models.json"), "w").write(json.dumps(cfg))
          PY
          pi --list-models

      # PyYAML 在 ubuntu-latest 上不保证预装，装一次比写个手解析器便宜。
      - run: python3 -m pip install --quiet pyyaml

      - name: 挑选、适配与提 PR
        env:
          GH_TOKEN: ${{ secrets.AUTOBOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # 轮换模型：单个模型偶尔这一轮退化成聊天（回「我没有工具」），换一个再试
          PI_MODELS: ${{ vars.PI_MODELS }}
          PI_NATIVE: "1"
          SRC: ${{ inputs.repo }}
          # PI 的 agent home 放 runner.temp：放 workspace 会被 git add -A 一起提交
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
          PI_SKIP_VERSION_CHECK: "1"
        run: |
          if [ -n "$SRC" ]; then
            python3 scripts/autobot.py --repo "$SRC"
          else
            python3 scripts/autobot.py
          fi

      - name: 报告进 job summary
        if: always()
        run: cat autobot-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "无报告" >> "$GITHUB_STEP_SUMMARY"
